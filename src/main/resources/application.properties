# Configuração da Aplicação Baozi Store
spring.application.name=baozistore
server.port=8080

# Configuração do Banco de Dados Relacional H2
spring.datasource.url=jdbc:h2:mem:baozidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Acesse em http://localhost:8080/h2-console no navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

